name: HACS

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # HACS validation depends on repository settings and on the state of the
    # default branch, both of which can drift without anyone touching the code.
    - cron: "0 4 * * 1"

# Deliberately not run on pull requests: the action validates the repository as
# GitHub serves it -- default branch, description, topics -- not the checkout,
# so on a branch it reports the state of main and would sit red for reasons the
# pull request cannot fix.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # brands wants the domain to be in home-assistant/brands, which is
          # for integrations that ship with Home Assistant or are on the way
          # there. A custom integration installed by hand is not, and HACS
          # installs it regardless -- the icon is simply the default one.
          ignore: brands
