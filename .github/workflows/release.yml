name: Release

on:
  push:
    tags: ["v*"]

env:
  CARD: custom_components/skywatch/frontend/skywatch-card.js

# HACS installs an integration from the newest release, taking the contents of
# custom_components/skywatch at that tag. There is nothing to attach: the card
# travels inside the integration that serves it.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Never publish a tag that would not load in the browsers the card claims
      # to support.
      - name: Parse as ES2018
        run: npx --yes acorn@8 --ecma2018 --module --silent "$CARD"

      - name: Test the model
        run: node --test test/model.test.mjs test/contract.test.mjs

      - name: Test the client
        run: |
          pip install aiohttp
          python -m unittest discover -s test -p 'test_*.py'

      - name: Check the tag matches every version
        run: |
          card=$(grep -oP 'CARD_VERSION = "\K[^"]+' "$CARD")
          const=$(grep -oP '^VERSION = "\K[^"]+' custom_components/skywatch/const.py)
          manifest=$(grep -oP '"version": "\K[^"]+' custom_components/skywatch/manifest.json)
          tag="${GITHUB_REF_NAME#v}"
          for name in card const manifest; do
            eval "value=\$$name"
            if [ "$value" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match $name version $value"
              exit 1
            fi
          done

      - name: Publish
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
