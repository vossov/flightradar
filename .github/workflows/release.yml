name: Release

on:
  push:
    tags: ["v*"]

# HACS prefers a release over the default branch: it looks for the file named
# in hacs.json among the release assets first, and only falls back to the file
# tree. Attaching the card means an install pulls exactly the asset of the
# version it says it is installing.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Never publish a tag that would not load in the browsers the card claims
      # to support.
      - name: Parse as ES2018
        run: npx --yes acorn@8 --ecma2018 --module --silent skywatch-card.js

      - name: Test the model
        run: node --test test/model.test.mjs

      - name: Check the tag matches CARD_VERSION
        run: |
          version=$(grep -oP 'CARD_VERSION = "\K[^"]+' skywatch-card.js)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CARD_VERSION $version"
            exit 1
          fi

      - name: Publish
        run: gh release create "$GITHUB_REF_NAME" skywatch-card.js --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
